name: Solar release checks
on:
  push:
    branches: [codex/solar-release-hardening]
  pull_request:
    paths: ['src/**', 'tests/**', 'package*.json', 'vite.config.ts', '.github/workflows/solar-release.yml', 'scripts/**']
permissions:
  contents: read
concurrency:
  group: solar-release
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch only runtime art
        run: git lfs pull --include="public/assets/game/**"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package double-click playable game
        run: node scripts/package-playable.mjs
      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          google-chrome --version
      - name: Test the actual standalone game in Chromium
        run: node scripts/browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: browser-evidence/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: PLAY-MEGAWATT-VALLEY
          path: playable/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: static-web-build
          path: dist/
          retention-days: 14
