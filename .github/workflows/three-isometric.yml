name: True 3D isometric checks
on:
  push:
    branches: [codex/3d-isometric]
    paths-ignore: ['Docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: true-3d
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Fetch runtime images and curated source models
        run: git lfs pull --include="public/assets/game/**,public/assets/sourced/kenney-city-kit-industrial/Models/GLB format/solar-panel-landscape-group.glb,public/assets/sourced/kenney-city-kit-industrial/Models/GLB format/building-p.glb,public/assets/sourced/kenney-city-kit-industrial/Models/GLB format/building-i.glb,public/assets/sourced/kenney-nature-kit/Models/GLTF format/tree_oak.glb,public/assets/sourced/kenney-nature-kit/Models/GLTF format/tree_pineRoundA.glb,public/assets/sourced/kenney-nature-kit/Models/GLTF format/tree_oak_dark.glb,public/assets/sourced/kenney-nature-kit/Models/GLTF format/plant_bush.glb,public/assets/sourced/kenney-nature-kit/Models/GLTF format/stone_largeA.glb"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/package-playable.mjs
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Capture actual 3D runtime
        run: node scripts/three-capture.mjs
      - name: Exercise the complete existing game in 3D
        run: node scripts/browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: true-3d-evidence
          path: |
            three-evidence/
            browser-evidence/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: MEGAWATT-VALLEY-3D-OFFLINE
          path: playable/
          retention-days: 30
