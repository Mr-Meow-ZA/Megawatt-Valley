name: Resolve 3D dependencies
on:
  push:
    branches: [codex/3d-isometric]
    paths: ['package.json', '.github/workflows/resolve-3d.yml']
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts
      - run: node -e "console.log('LOCK_JSON:'+require('fs').readFileSync('package-lock.json','utf8').replaceAll('\n',''))"
