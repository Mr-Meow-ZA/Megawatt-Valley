name: Desktop release
on:
  push:
    branches: [codex/3d-isometric]
    # Browser-only checks and documentation do not rebuild an identical installer.
    # Use workflow_dispatch when changing only this workflow.
    paths: ['src/**', 'desktop/**', 'tests/**', 'public/assets/**', 'package*.json', 'scripts/package-*.mjs', 'scripts/model-manifest.mjs', 'scripts/embed-glb.mjs', 'scripts/desktop*.mjs', '.github/workflows/desktop-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-3d-release
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch runtime art
        run: git lfs pull --include="public/assets/game/**,public/assets/sourced/kenney-city-kit-industrial/Models/GLB format/Textures/**,public/assets/sourced/kenney-city-kit-industrial/Models/GLB format/solar-panel-landscape-group.glb,public/assets/sourced/kenney-city-kit-industrial/Models/GLB format/building-p.glb,public/assets/sourced/kenney-city-kit-industrial/Models/GLB format/building-i.glb,public/assets/sourced/kenney-nature-kit/Models/GLTF format/tree_oak.glb,public/assets/sourced/kenney-nature-kit/Models/GLTF format/tree_pineRoundA.glb,public/assets/sourced/kenney-nature-kit/Models/GLTF format/tree_oak_dark.glb,public/assets/sourced/kenney-nature-kit/Models/GLTF format/plant_bush.glb,public/assets/sourced/kenney-nature-kit/Models/GLTF format/stone_largeA.glb"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node --test desktop/save-store.test.cjs
      - run: node scripts/package-playable.mjs
      - run: node scripts/package-desktop.mjs
      - name: Install pinned desktop tools
        run: npm install --prefix desktop --no-audit --no-fund
      - name: Build the Windows application
        timeout-minutes: 6
        run: npm run package:dir --prefix desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install desktop test driver
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Exercise the packaged Windows executable
        run: node scripts/desktop-check.mjs
      - name: Package the tested Windows application
        timeout-minutes: 8
        run: npm run package --prefix desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence
          path: desktop-evidence/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: MEGAWATT-VALLEY-3D-WINDOWS
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            Docs/TRUE_3D_DESKTOP.md
            desktop/package-lock.json
          retention-days: 30
