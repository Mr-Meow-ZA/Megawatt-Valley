# Publish static Phaser build to the `gh-pages` branch for GitHub Pages.
# One-time owner setup: Settings → Pages → Deploy from branch → `gh-pages` / root.
# (actions/deploy-pages requires Pages already enabled; branch publish works first.)
name: Deploy Pages

on:
  push:
    branches: [main, cursor/level1-steam-finish-5938]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: touch dist/.nojekyll
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'chore: publish playtest build'